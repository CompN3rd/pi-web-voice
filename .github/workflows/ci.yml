name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Install locked Playwright Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Locate Chromium
        run: node --input-type=module -e 'import { chromium } from "playwright-core"; import fs from "node:fs"; fs.appendFileSync(process.env.GITHUB_ENV, `VOICE_BROWSER_EXECUTABLE=${chromium.executablePath()}\n`);'
      - run: npm run test:browser
      - run: npm run test:runtime
      - run: git diff --check
